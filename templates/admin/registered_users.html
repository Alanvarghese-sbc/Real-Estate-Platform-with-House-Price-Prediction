{% extends 'admin/adminLayout.html' %}
{% block content %}

    <div class="col-lg-12">
  <div class="table-responsive">
    <table class="table mb-0 text-nowrap varient-table align-middle fs-3">
      <thead>
        <tr>
          <th colspan="12" class="fw-bold">View Users</th>
        </tr>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>User_type</th>
          <th>Address</th>
          <th>Location</th>
         
        </tr>
      </thead>
      <tbody>
        <tr>

          {% for u in ulist %}
        <tr>
            <td>{{ u.full_name }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.phone_number }}</td>
            <td>{{ u.user_type}}</td>
            <td>{{ u.address }}</td>
            <td>{{ u.location }}</td>
            
        </tr>
        {% empty %}
        <tr>
            <td colspan="7">No records found</td>
        </tr>
        {% endfor %}

        </tr>
      </tbody>
    </table>
  </div>
</div>

{% endblock %}
