{% extends 'admin/adminLayout.html' %}
{% load static %}

{% block content %}

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card shadow-sm border-0">

        <div class="card-body">

          <h4 class="mb-2">{{ p.property_name }}</h4>

          <p class="text-muted mb-3">
            {{ p.property_loc }}, {{ p.property_district }}
          </p>

          <!-- Google Map -->
          <div style="height:350px;">
            <iframe
              width="100%"
              height="100%"
              frameborder="0"
              style="border-radius:8px;"
              src="https://www.google.com/maps?q={{ p.property_latitude }},{{ p.property_longitude }}&output=embed"
              allowfullscreen>
            </iframe>
          </div>

        </div>

      </div>

    </div>
  </div>
</div>

{% endblock %}
