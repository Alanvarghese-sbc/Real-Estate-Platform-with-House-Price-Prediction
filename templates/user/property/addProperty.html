{% extends 'user/userLayout.html' %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div class="row">
  <div class="col-12">
    <div class="card shadow-sm border-0 rounded-4 mb-4">
      <div class="card-header bg-white pb-0 border-0 pt-4 px-4">
        <h4 class="card-title mb-1 fw-bold fs-5">Add New Property</h4>
        <p class="text-muted fs-7">List your house securely on the marketplace</p>
      </div>
      <div class="card-body px-4 pb-4">
        <form method="post" enctype="multipart/form-data" action="{% url 'saveProperty' %}">
          {% csrf_token %}
          
          <div class="row g-4">
            
            <!-- Property Name -->
            <div class="col-md-12">
              <label class="form-label fw-semibold text-dark">Property Title</label>
              <input type="text" name="property_name" class="form-control shadow-none" placeholder="e.g. Spacious 4BHK Villa in Downtown" required>
            </div>

            <!-- Description -->
            <div class="col-md-12">
              <label class="form-label fw-semibold text-dark">Description</label>
              <textarea name="property_desc" class="form-control shadow-none" rows="3" placeholder="Describe the property's key features, nearby amenities, etc..."></textarea>
            </div>

            <!-- Image -->
            <div class="col-md-12">
              <label class="form-label fw-semibold text-dark">Primary Display Image</label>
              <input type="file" name="property_image" class="form-control shadow-none" accept="image/*" required>
            </div>

            <!-- Location & District -->
            <div class="col-md-6">
                <label class="form-label fw-semibold text-dark">Search Location</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="ti ti-map-pin"></i></span>
                    <input type="text" name="property_loc" id="property_loc" class="form-control shadow-none" placeholder="Type a city or exact address...">
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold text-dark">Assigned District</label>
                <input type="text" name="property_district" id="district" class="form-control bg-light shadow-none" placeholder="Auto-filled from map selection">
            </div>

            <!-- MAP -->
            <div class="col-12 mt-3">
                <div id="map" class="rounded-3 shadow-sm" style="height:300px; width:100%; display:none; border: 1px solid #e0e0e0;"></div>
            </div>

            <!-- Lat & Long -->
            <div class="col-md-6 mt-2">
                <label class="form-label fw-bold text-muted fs-2 text-uppercase">Latitude (GPS)</label>
                <input type="text" name="property_latitude" id="lat" class="form-control bg-light text-muted fs-2 shadow-none" readonly>
            </div>
            <div class="col-md-6 mt-2">
                <label class="form-label fw-bold text-muted fs-2 text-uppercase">Longitude (GPS)</label>
                <input type="text" name="property_longitude" id="lng" class="form-control bg-light text-muted fs-2 shadow-none" readonly>
            </div>

            <!-- Divider -->
            <div class="col-12"><hr class="my-2 border-light"></div>

            <!-- Area & Bedrooms -->
            <div class="col-md-4">
                <label class="form-label fw-semibold text-dark">Usable Area</label>
                <div class="input-group">
                    <input type="number" name="property_area" class="form-control shadow-none" placeholder="e.g. 1500" required>
                    <span class="input-group-text bg-white">sq.ft</span>
                </div>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold text-dark">Bedrooms</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="ti ti-bed fs-4"></i></span>
                    <input type="number" name="no_of_bed_rooms" class="form-control shadow-none" placeholder="e.g. 3" required>
                </div>
            </div>

            <!-- Status -->
            <div class="col-md-4">
                <label class="form-label fw-semibold text-dark">Initial Status</label>
                <select name="property_status" class="form-select shadow-none bg-white">
                  <option value="Available">Available (Public)</option>
                  <option value="Blocked">Draft (Blocked)</option>
                </select>
            </div>

            <!-- Divider -->
            <div class="col-12"><hr class="my-2 border-light"></div>

            <!-- Prices -->
            <div class="col-md-8">
              <label class="form-label fw-bolder text-primary fs-4">Listing Asking Price</label>
              <div class="input-group input-group-lg shadow-sm border border-primary rounded-3 overflow-hidden">
                <span class="input-group-text bg-primary text-white border-0 fw-bold fs-4">₹</span>
                <input type="number" name="price_listed" class="form-control border-0 shadow-none fw-bold text-dark fs-4" placeholder="Amount you want to receive..." required>
              </div>
              
              <div id="ai-suggestion-box" class="mt-3 p-3 rounded-3" style="display: none; background: linear-gradient(135deg, #f0f7ff 0%, #e1effe 100%); border: 1px solid #b6d4fe; border-left: 5px solid #0d6efd; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
                  <div class="d-flex align-items-center">
                      <div class="me-3">
                          <div class="bg-primary text-white d-flex justify-content-center align-items-center rounded-circle" style="width: 45px; height: 45px; box-shadow: 0 2px 5px rgba(13,110,253,0.3);">
                              <i class="ti ti-robot fs-6"></i>
                          </div>
                      </div>
                      <div>
                          <small class="text-primary fw-bolder text-uppercase" style="letter-spacing: 0.6px; font-size: 0.75rem;">DeepMind Real Estate Estimate</small><br>
                          <strong id="ai-price-value" class="fs-3 text-dark fw-black"></strong>
                      </div>
                  </div>
              </div>
            </div>
            
            <!-- Submit Button -->
            <div class="col-md-4 d-flex align-items-end justify-content-end">
                <button type="submit" class="btn btn-primary btn-lg w-100 shadow rounded-3 fw-bold py-3 transition-all hover-lift">
                    <i class="ti ti-device-floppy me-2 fs-5"></i> Publish Listing
                </button>
            </div>

          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
let map, marker;
let typingTimer;
const delay = 1000; // wait after typing stops

const locationInput = document.getElementById("property_loc");
const latInput = document.getElementById("lat");
const lngInput = document.getElementById("lng");
const districtInput = document.getElementById("district");

locationInput.addEventListener("keyup", function () {
  clearTimeout(typingTimer);
  if (this.value.length > 3) {
    typingTimer = setTimeout(() => {
      geocodeLocation(this.value);
    }, delay);
  }
});

function geocodeLocation(query) {
  fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&q=${query}`)
    .then(res => res.json())
    .then(data => {
      if (!data.length) return;

      const place = data[0];
      const lat = place.lat;
      const lng = place.lon;

      // Fill lat/lng
      latInput.value = lat;
      lngInput.value = lng;

      // Auto-fill district (if available)
      if (place.address) {
        districtInput.value =
          place.address.state_district ||
          place.address.county ||
          place.address.state ||
          "";
      }

      showMap(lat, lng);
    });
}

function showMap(lat, lng) {
  document.getElementById("map").style.display = "block";

  if (!map) {
    map = L.map("map").setView([lat, lng], 14);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    marker = L.marker([lat, lng], { draggable: true }).addTo(map);

    marker.on("dragend", function () {
      const pos = marker.getLatLng();
      latInput.value = pos.lat;
      lngInput.value = pos.lng;

      reverseGeocode(pos.lat, pos.lng);
    });
  } else {
    map.setView([lat, lng], 14);
    marker.setLatLng([lat, lng]);
  }
}

function reverseGeocode(lat, lng) {
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat=${lat}&lon=${lng}`)
    .then(res => res.json())
    .then(data => {
      if (data.address) {
        districtInput.value =
          data.address.state_district ||
          data.address.county ||
          data.address.state ||
          districtInput.value;
      }
    });
}  

// --- AI Live Price Prediction ---
const areaInput = document.querySelector('input[name="property_area"]');
const bedroomsInput = document.querySelector('input[name="no_of_bed_rooms"]');

function fetchAIPrice() {
  const district = districtInput.value;
  const area = areaInput.value;
  const bedrooms = bedroomsInput.value;
  const location = locationInput.value;

  if (district && area && bedrooms) {
    const params = new URLSearchParams({
      district: district,
      area: area,
      bedrooms: bedrooms,
      location: location
    });

    fetch(`/user/api/predict-price/?${params}`)
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          const formattedPrice = new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: 'INR',
            maximumFractionDigits: 0
          }).format(data.predicted_price);
          
          document.getElementById('ai-price-value').innerText = formattedPrice;
          document.getElementById('ai-suggestion-box').style.display = 'block';
        } else {
          console.error("AI Prediction Error:", data.message);
          document.getElementById('ai-suggestion-box').style.display = 'none';
        }
      })
      .catch(err => console.error("Fetch Error:", err));
  }
}

// Attach listeners to trigger prediction
locationInput.addEventListener('blur', fetchAIPrice);
districtInput.addEventListener('change', fetchAIPrice);
areaInput.addEventListener('keyup', () => {
  clearTimeout(typingTimer);
  typingTimer = setTimeout(fetchAIPrice, delay);
});
bedroomsInput.addEventListener('keyup', () => {
  clearTimeout(typingTimer);
  typingTimer = setTimeout(fetchAIPrice, delay);
});
</script>

{% endblock %}
